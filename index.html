<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار شامل في أمن المعلومات (ITGS224) - 100 سؤال</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            color: #1e293b;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px 35px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
        }
        h1 {
            font-size: 2rem;
            color: #0f172a;
            border-right: 6px solid #2563eb;
            padding-right: 18px;
            margin-bottom: 8px;
        }
        .subhead {
            color: #475569;
            margin-bottom: 30px;
            font-size: 1.05rem;
            border-bottom: 2px dashed #e2e8f0;
            padding-bottom: 16px;
        }
        .question-card {
            background: #f8fafc;
            border-radius: 16px;
            padding: 18px 22px;
            margin-bottom: 18px;
            border: 1px solid #e2e8f0;
            transition: 0.2s;
        }
        .question-card:hover {
            border-color: #94a3b8;
        }
        .q-title {
            font-weight: 700;
            font-size: 1.05rem;
            margin-bottom: 10px;
            color: #0f172a;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 12px;
        }
        .options label {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 10px;
            transition: 0.15s;
            font-size: 0.98rem;
        }
        .options label:hover {
            background: #e6edf5;
        }
        .options input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #2563eb;
            flex-shrink: 0;
        }
        .correct-highlight {
            background: #dcfce7 !important;
            border-right: 4px solid #16a34a;
        }
        .wrong-highlight {
            background: #fee2e2 !important;
            border-right: 4px solid #dc2626;
        }
        .show-correct-answer {
            font-size: 0.9rem;
            color: #16a34a;
            font-weight: 600;
            margin-top: 6px;
            display: none;
        }
        .btn-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin: 35px 0 20px;
        }
        .btn {
            padding: 14px 48px;
            border: none;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
            background: #e2e8f0;
            color: #1e293b;
        }
        .btn-primary {
            background: #2563eb;
            color: white;
            box-shadow: 0 8px 20px rgba(37,99,235,0.25);
        }
        .btn-primary:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(37,99,235,0.3);
        }
        .btn-secondary {
            background: #f1f5f9;
            color: #334155;
            border: 1px solid #cbd5e1;
        }
        .btn-secondary:hover {
            background: #e2e8f0;
        }
        #results {
            margin-top: 30px;
            padding: 25px 30px;
            border-radius: 20px;
            background: #f1f5f9;
            text-align: center;
            border: 1px solid #cbd5e1;
            display: none;
        }
        #results .score {
            font-size: 2.6rem;
            font-weight: 800;
            color: #0f172a;
        }
        #results .detail {
            font-size: 1.1rem;
            color: #334155;
            margin-top: 6px;
        }
        .footer {
            margin-top: 30px;
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
        }
        @media (max-width: 600px) {
            .container { padding: 18px; }
            h1 { font-size: 1.6rem; }
            .question-card { padding: 14px; }
            .btn { padding: 12px 28px; font-size: 1rem; width: 100%; }
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <h1>📘 اختبار أمن المعلومات (ITGS224)</h1>
    <div class="subhead">100 سؤال شامل · اختر الإجابة الصحيحة ثم اضغط "تصحيح"</div>

    <div id="quizArea">
        <!-- سيتم حقن الأسئلة بواسطة JavaScript -->
    </div>

    <div class="btn-container">
        <button class="btn btn-primary" onclick="submitQuiz()">✅ تصحيح الإجابات</button>
        <button class="btn btn-secondary" onclick="resetQuiz()">🔄 إعادة المحاولة</button>
    </div>

    <div id="results">
        <div class="score" id="scoreDisplay">0 / 100</div>
        <div class="detail" id="detailDisplay"></div>
    </div>
    <div class="footer">— كل التوفيق في مسيرتك الأكاديمية —</div>
</div>

<script>
    // ---------- بيانات الأسئلة والإجابات ----------
    const questions = [
        // 1
        { q: "وفقاً للمنهج الأكاديمي، ما هو الهدف المحوري لمنظومة أمن المعلومات؟", 
          opts: ["بناء جدران نارية معقدة", "منع أو التخفيف من الوصول غير المصرح به", "تطوير برمجيات خالية من الأخطاء", "تأمين الفضاء الإلكتروني فقط"], correct: 1 },
        // 2
        { q: "يتكون نموذج (PPT) الذي تشير إليه استراتيجيات أمن المعلومات من:", 
          opts: ["السياسات، البروتوكولات، والتقنية", "الأفراد، العمليات، والتقنية", "الوقاية، الكشف، والاستجابة", "الخصوصية، الحماية، والتدقيق"], correct: 1 },
        // 3
        { q: "ما الفرق الجوهري بين 'أمن المعلومات' و'الأمن السيبراني'؟", 
          opts: ["أمن المعلومات تخصص فرعي", "الأمن السيبراني أوسع ويشمل المادي", "أمن المعلومات نطاق كلي (رقمي ومادي) والأمن السيبراني تخصص فرعي للفضاء الإلكتروني", "لا يوجد فرق"], correct: 2 },
        // 4
        { q: "ما هي الثغرة الأمنية (Vulnerability) في سياق هندسة النظم؟", 
          opts: ["برمجية خبيثة", "نقطة ضعف أو خلل بنيوي في النظام", "جهة فاعلة تحاول استغلال النظام", "إجراء وقائي"], correct: 1 },
        // 5
        { q: "ينص 'مبدأ أقل الصلاحيات' (PoLP) على:", 
          opts: ["منح المستخدم جميع الصلاحيات", "منح المستخدم الحد الأدنى المطلق من الصلاحيات اللازمة", "إلغاء صلاحيات جميع المستخدمين", "منح الصلاحيات بناءً على الأقدمية"], correct: 1 },
        // 6

        // 7
        { q: "في نموذج (CIA Triad)، ماذا يعني مبدأ 'النزاهة' (Integrity)؟", 
          opts: ["ضمان التوافر الدائم", "ضمان عدم الإفشاء", "ضمان دقة البيانات وكمالها وموثوقيتها", "ضمان سرعة النقل"], correct: 2 },
        // 8

        // 9
        { q: "في منظومة (IAAAA)، ما الفرق بين 'التعريف' و'التحقق'؟",

        // 10

        // 11

        // 13
        { q: "وفقاً للمعادلة الأكاديمية، كيف تُصاغ المخاطرة (Risk)؟",

        // 14
        { q: "في التحليل النوعي للمخاطر، ما هي الأداة البصرية الأكثر شيوعاً؟",

        // 15
        { q: "ما هو 'مالك المخاطرة' (Risk Owner) في الحوكمة؟",

        // 16
        { q: "في التحليل الكمي، ماذا يعني اختصار (ALE)؟",

        // 17
        { q: "إذا كانت قيمة الأصل = 100,000 دولار ومعامل التعرض = 50%، فإن (SLE) تساوي:",

        { q: "استراتيجية 'نقل المخاطر' (Risk Transfer) تعني:",

        { q: "أي من التالي مثال واضح على 'تجنب المخاطر' (Avoidance)؟",

        // 20
        { q: "أي من التالي ليس من تصنيفات الضوابط الأمنية الوظيفية؟",

        // 21
        { q: "'الشهية للمخاطر' (Risk Appetite) تُعرّف بأنها:", 
          opts: ["الحد الأقصى للانحراف", "مقدار ونوع المخاطر التي تقبلها الإدارة سعياً لأهدافها", "المخاطر التي لا تقاس كمياً", "جميع المخاطر المحددة"], correct: 1 },
        // 22
        { q: "في إدارة الثغرات، ما المقصود بـ (CVSS)؟",

        // 23
        { q: "أي من التالي في أعلى هرم جهات التهديد من حيث المهارات والموارد؟", 
          opts: ["قراصنة الناشطون", "أطفال السكريبتات", "التهديدات المتقدمة المستمرة (APTs)", "عصابات الجريمة"], correct: 2 },
        // 24
        { q: "ما هو الدافع الأساسي لعصابات الجريمة السيبرانية؟", 
          opts: ["نشر أيديولوجية", "إثبات الذات", "تحقيق مكاسب مالية غير مشروعة", "التجسس الاستراتيجي"], correct: 2 },
        // 25
        { q: "'أطفال السكريبتات' (Script Kiddies) هم:", 
          opts: ["قراصنة محترفون للحكومات", "أفراد يفتقرون للخبرة ويعتمدون على أدوات جاهزة لإثبات الذات", "عصابات بطاقات ائتمان", "مهندسون أخلاقيون"], correct: 1 },
        // 26
        { q: "أي من التالي هجوم يستهدف كبار المديرين التنفيذيين (C-Level)؟",

        // 27
        { q: "ما هي تقنية 'التصيد الصوتي' (Vishing)؟", 
          opts: ["رسائل بريد مزيفة", "مكالمات هاتفية احتيالية بانتحال شخصية رسمية", "رسائل نصية (SMS) خبيثة", "ترك وسائط تخزين مصابة"], correct: 1 },
        // 28
        { q: "أي من البرمجيات لا ينسخ نفسه ولكنه يخلق باباً خلفياً؟", 
          opts: ["فيروسات", "ديدان", "أحصنة طروادة", "برمجيات فدية"], correct: 2 },
        // 29
        { q: "كيف تتجنب البرمجيات 'متعددة الأشكال' (Polymorphic) اكتشاف برامج الحماية؟",

        // 30
        { q: "أي من التالي يُعتبر 'مؤشر اختراق' (IoC)؟", 
          opts: ["سياسة كلمات مرور ضعيفة", "تحديثات النظام الدورية", "ارتفاع مفاجئ في استهلاك موارد الشبكة", "جدار ناري مكون بشكل صحيح"], correct: 2 },
        // 31
        { q: "أي ناقل عدوى يصيب المستخدم بمجرد زيارة موقع مخترق دون نقره على شيء؟", 
          opts: ["التصيد", "التنزيل التلقائي (Drive-by)", "مرفقات البريد", "الهندسة الاجتماعية"], correct: 1 },
        // 32
        { q: "'التهديد الداخلي' (Insider Threat) هو:", 
          opts: ["هجمات من دول أجنبية", "تهديد من أفراد يمتلكون صلاحيات وصول", "هجمات عبر واي فاي عام", "برمجيات من الإنترنت"], correct: 1 },
        // 33
        { q: "أي محفز نفسي يعتمد على خلق حالة طوارئ وهمية لإجبار الضحية على التسرع؟",

        // 34

        // 35

    // ---------- بناء واجهة الأسئلة ----------
    function renderQuiz() {
        const area = document.getElementById('quizArea');
        let html = '';
        for (let i = 0; i < questions.length; i++) {
            const q = questions[i];
            const qNum = i + 1;
            const optsHtml = q.opts.map((opt, idx) => {
                const letter = String.fromCharCode(65 + idx); // A, B, C, D
                return `<label>
                            <input type="radio" name="q${qNum}" value="${letter}">
                            <span><strong>${letter}.</strong> ${opt}</span>
                        </label>`;
            }).join('');

            html += `
                        <div class="question-card" id="card-${qNum}">
                            <div class="q-title">${qNum}. ${q.q}</div>
                            <div class="options">${optsHtml}</div>
                            <div class="show-correct-answer" id="feedback-${qNum}"></div>
                        </div>
                    `;
        }
        area.innerHTML = html;
    }

    // ---------- التصحيح ----------
    function submitQuiz() {
        let correctCount = 0;
        const total = questions.length;
        let allAnswered = true;

        // تعطيل الأزرار مؤقتاً لتجنب الضغط المتكرر
        const submitBtn = document.querySelector('.btn-primary');
        submitBtn.disabled = true;

        for (let i = 0; i < total; i++) {
            const qNum = i + 1;
            const selected = document.querySelector(`input[name="q${qNum}"]:checked`);
            const card = document.getElementById(`card-${qNum}`);
            const feedback = document.getElementById(`feedback-${qNum}`);
            
            // إزالة التظليل السابق
            card.classList.remove('correct-highlight', 'wrong-highlight');
            
            // إظهار الإجابة الصحيحة دائماً
            const correctLetter = String.fromCharCode(65 + questions[i].correct);
            feedback.style.display = 'block';
            feedback.innerHTML = `✅ الإجابة الصحيحة: <strong>${correctLetter}</strong>`;

            if (selected) {
                const userVal = selected.value;
                if (userVal === correctLetter) {
                    correctCount++;
                    card.classList.add('correct-highlight');
                } else {
                    card.classList.add('wrong-highlight');
                    // تظليل الخيار الخاطئ الذي اختاره المستخدم باللون الأحمر (اختياري)
                    const labels = card.querySelectorAll('.options label');
                    labels.forEach(label => {
                        const radio = label.querySelector('input[type="radio"]');
                        if (radio && radio.checked && radio.value !== correctLetter) {
                            label.style.background = '#fee2e2';
                            label.style.borderRight = '4px solid #dc2626';
                        }
                        if (radio && radio.value === correctLetter) {
                            label.style.background = '#dcfce7';
                            label.style.borderRight = '4px solid #16a34a';
                        }
                    });
                }
            } else {
                allAnswered = false;
                card.classList.add('wrong-highlight');
                // تظليل الإجابة الصحيحة باللون الأخضر حتى لو لم يجب
                const labels = card.querySelectorAll('.options label');
                labels.forEach(label => {
                    const radio = label.querySelector('input[type="radio"]');
                    if (radio && radio.value === correctLetter) {
                        label.style.background = '#dcfce7';
                        label.style.borderRight = '4px solid #16a34a';
                    }
                });
            }
        }

        // عرض النتيجة
        const resultDiv = document.getElementById('results');
        resultDiv.style.display = 'block';
        document.getElementById('scoreDisplay').textContent = `${correctCount} / ${total}`;
        let detailMsg = '';
        if (correctCount === total) {
            detailMsg = '🎉 ممتاز! إجابة مثالية!';
        } else if (correctCount >= 90) {
            detailMsg = '⭐ ممتاز! أنت جاهز تماماً.';
        } else if (correctCount >= 75) {
            detailMsg = '👍 جيد جداً، راجع النقاط التي أخطأت فيها.';
        } else if (correctCount >= 50) {
            detailMsg = '📖 تحتاج إلى مراجعة مكثفة للمفاهيم الأساسية.';
        } else {
            detailMsg = '📚 أنصحك بإعادة قراءة الملفات من البداية مع التركيز على المصطلحات الأساسية.';
        }
        if (!allAnswered) {
            detailMsg += ' ⚠️ (بعض الأسئلة لم تُجب، اعتبرت خاطئة)';
        }
        document.getElementById('detailDisplay').textContent = detailMsg;

        // تمرير للنتيجة
        resultDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });

        submitBtn.disabled = false;
    }

    // ---------- إعادة المحاولة ----------
    function resetQuiz() {
        // إعادة تعيين جميع الـ radio buttons
        const radios = document.querySelectorAll('input[type="radio"]');
        radios.forEach(r => r.checked = false);

        // إعادة تعيين التظليل
        const cards = document.querySelectorAll('.question-card');
        cards.forEach(card => {
            card.classList.remove('correct-highlight', 'wrong-highlight');
            const labels = card.querySelectorAll('.options label');
            labels.forEach(label => {
                label.style.background = '';
                label.style.borderRight = '';
            });
        });

        // إخفاء النتيجة وإعادة تعيين الفيدباك
        document.getElementById('results').style.display = 'none';
        const feedbacks = document.querySelectorAll('.show-correct-answer');
        feedbacks.forEach(f => {
            f.style.display = 'none';
            f.innerHTML = '';
        });

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ---------- التهيئة ----------
    window.onload = renderQuiz;
</script>

</body>
</html>
